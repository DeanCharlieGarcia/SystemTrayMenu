trigger:
  - master
  - main

pool:
  vmImage: windows-2025-vs2026

steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      useGlobalJson: true
      workingDirectory: '$(Build.SourcesDirectory)'
  - pwsh: .\Build.ps1 -Publish
    displayName: Build, test and publish HitNGone
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.SourcesDirectory)/artifacts/HitNGone'
      artifact: HitNGone-win-x64
